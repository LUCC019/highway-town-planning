            onSelect(id){selectedId=id;expandedPopupKey="";expandedNestedPopupKey="";render();},
            onTogglePopup(key){expandedPopupKey=expandedPopupKey===key?"":key;render();},
            onToggleNestedPopup(key){expandedNestedPopupKey=expandedNestedPopupKey===key?"":key;render();}
          }); render();
        }
        document.dispatchEvent(new Event("retail-document-ready"));
      }
      const characterPageTabs = document.querySelector("[data-character-page-tabs]");
      if (characterPageTabs) {
        const pageTabs = [...characterPageTabs.querySelectorAll("[data-character-page-tab]")];
        const pagePanels = [...document.querySelectorAll("[data-character-page-panel]")];
        const showCharacterPage = (pageId, updateUrl = false) => {
          const activePageId = pageId === "interface" ? "interface" : (pageId === "config" && item.id === "protagonists" ? "config" : "rules");
          pageTabs.forEach((button) => {
            const active = button.dataset.characterPageTab === activePageId;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", active ? "true" : "false");
          });
          pagePanels.forEach((panel) => {
            const active = panel.dataset.characterPagePanel === activePageId;
            panel.classList.toggle("is-active", active);
            panel.hidden = !active;
          });
          if (updateUrl) {
            const nextUrl = new URL(location.href);
            if (activePageId === "rules") nextUrl.searchParams.delete("shopTab");
            else nextUrl.searchParams.set("shopTab", activePageId);
            history.replaceState(null, "", nextUrl);
          }
        };
        pageTabs.forEach((button) => button.addEventListener("click", () => showCharacterPage(button.dataset.characterPageTab, true)));
        showCharacterPage(new URLSearchParams(location.search).get("shopTab"));
      }
      if (item.id === "convenience-store" && retailMarkdown) splitConvenienceDocument(document.querySelector("#app"));
      const shopPageTabs = document.querySelector("[data-shop-page-tabs]");
      if (shopPageTabs) {
        const pageTabs = [...shopPageTabs.querySelectorAll("[data-shop-page-tab]")];
        const pagePanels = [...document.querySelectorAll("[data-shop-page-panel]")];
        const showShopPage = (pageId, updateUrl = false) => {
          const activePageId = pageTabs.some(button => button.dataset.shopPageTab === pageId) ? pageId : "rules";
          pageTabs.forEach((button) => {
            const active = button.dataset.shopPageTab === activePageId;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", active ? "true" : "false");
          });
          pagePanels.forEach((panel) => {
            const active = panel.dataset.shopPagePanel === activePageId;
            panel.classList.toggle("is-active", active);
            panel.hidden = !active;
          });
          if (updateUrl) {
            try {
              const nextUrl = new URL(location.href);
              if (activePageId === "rules") nextUrl.searchParams.delete("shopTab");
              else nextUrl.searchParams.set("shopTab", activePageId);
              history.replaceState(null, "", nextUrl);
            } catch {}
          }
          if (updateUrl && ["gas-station", "convenience-store"].includes(item.id)) {
            window.scrollTo(0, 0);
            document.dispatchEvent(new CustomEvent("gas-shop-page-change"));
          }
        };
        pageTabs.forEach((button) => button.addEventListener("click", () => showShopPage(button.dataset.shopPageTab, true)));
        showShopPage(new URLSearchParams(location.search).get("shopTab"));
        if (window.parent === window && ["gas-station", "convenience-store"].includes(item.id)) {
          const miniCard = document.querySelector("[data-shop-minigame-ui-rules]");
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          (async () => {
            try {
              const response = await fetch("/api/shop-ui/formal", {signal: controller.signal});
              if (!response.ok) throw new Error("界面资料读取失败");
              const result = await response.json();
              const source = result.documents?.[item.id];
              let miniScreen = source?.uiScreens?.find((screen) => screen.id.startsWith("minigame-"));
              if (!miniScreen) return;
              let selectedId = Number(miniScreen.uiRules?.[0]?.id || 1), expandedPopupKey = "", expandedNestedPopupKey = "";
              const render = () => renderShopUiRulesCard(miniCard, source, {editable:false, screenId:miniScreen.id, screenCategory:"minigame", selectedId, expandedPopupKey, expandedNestedPopupKey,
                onSelectScreen(id,jump={}) { const next = source.uiScreens?.find((screen) => screen.id === id && screen.id.startsWith("minigame-")); if (!next) return; miniScreen = next; selectedId = Number(jump.ruleId || next.uiRules?.[0]?.id || 1); expandedPopupKey=jump.popupKey||""; expandedNestedPopupKey=jump.nestedPopupKey||""; render(); },
                onSelect(id) { selectedId=id; expandedPopupKey=""; expandedNestedPopupKey=""; render(); },
                onTogglePopup(key) { expandedPopupKey=expandedPopupKey===key?"":key; render(); },
                onToggleNestedPopup(key) { expandedNestedPopupKey=expandedNestedPopupKey===key?"":key; render(); }
              });
              render();
            } catch { miniCard.innerHTML = "<h2>小游戏界面暂时无法载入</h2><p>请刷新重试；未用旧图代替新资料。</p>"; }
            finally { clearTimeout(timer); }
          })();
        }
        if (retailMarkdown || item.id === "gas-station") document.dispatchEvent(new Event("retail-document-ready"));
      }
      const checkpointPageTabs = document.querySelector("[data-checkpoint-page-tabs]");
      if (checkpointPageTabs) {
        const pageTabs = [...checkpointPageTabs.querySelectorAll("[data-checkpoint-page-tab]")];
        const pagePanels = [...document.querySelectorAll("[data-checkpoint-page-panel]")];
        const showCheckpointPage = (pageId, updateUrl = false) => {
          const activePageId = ["rules", "config", "interface"].includes(pageId) ? pageId : "rules";
          pageTabs.forEach((button) => {
            const active = button.dataset.checkpointPageTab === activePageId;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", active ? "true" : "false");
          });
          pagePanels.forEach((panel) => {
            const active = panel.dataset.checkpointPagePanel === activePageId;
            panel.classList.toggle("is-active", active);
            panel.hidden = !active;
          });
          if (updateUrl) {
            const nextUrl = new URL(location.href);
            const tabParam = isDollHouse || isTalentMarket || isTalentShow ? "shopTab" : "checkpointTab";
            if (activePageId === "rules") nextUrl.searchParams.delete(tabParam);
            else nextUrl.searchParams.set(tabParam, activePageId);
            history.replaceState(null, "", nextUrl);
          }
        };
        pageTabs.forEach((button) => button.addEventListener("click", () => showCheckpointPage(button.dataset.checkpointPageTab, true)));
        showCheckpointPage(new URLSearchParams(location.search).get(isDollHouse || isTalentMarket || isTalentShow ? "shopTab" : "checkpointTab"));
      }
      if (isDollHouse) {
        // Delegate so saved body overrides can supply the inner tabs after load.
        document.addEventListener("click", (event) => {
          const button = event.target.closest("[data-lucky-claw-rule-tab]");
          if (!button) return;
          const root = button.closest('[data-checkpoint-page-panel="rules"]');
          if (!root) return;
          const selected = button.dataset.luckyClawRuleTab;
          root.querySelectorAll("[data-lucky-claw-rule-tab]").forEach((tab) => {
            const active = tab.dataset.luckyClawRuleTab === selected;
            tab.classList.toggle("is-active", active);
            tab.setAttribute("aria-pressed", String(active));
          });
          root.querySelectorAll("[data-lucky-claw-rule-panel]").forEach((panel) => {
            const active = panel.dataset.luckyClawRulePanel === selected;
            panel.classList.toggle("is-active", active);
            panel.hidden = !active;
          });
        });
      }
      const shopUiRules = document.querySelector("[data-shop-ui-rules]");
      if (shopUiRules) {
        const ruleTabs = [...shopUiRules.querySelectorAll("[data-shop-ui-rule-tab]")];
        const rulePages = [...shopUiRules.querySelectorAll("[data-shop-ui-rule-page]")];
        const showShopUiRule = (ruleId) => {
          ruleTabs.forEach((button) => {
            const active = button.dataset.shopUiRuleTab === String(ruleId);
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", active ? "true" : "false");
          });
          rulePages.forEach((page) => {
            const active = page.dataset.shopUiRulePage === String(ruleId);
            page.classList.toggle("is-active", active);
            page.hidden = !active;
          });
        };
        ruleTabs.forEach((button) => button.addEventListener("click", () => showShopUiRule(button.dataset.shopUiRuleTab)));
      }
      const checkpointEventPlanning = document.querySelector("[data-checkpoint-event-planning]");
      if (checkpointEventPlanning) {
        const checkpointEventTabs = [...checkpointEventPlanning.querySelectorAll("[data-checkpoint-event-tab]")];
        const checkpointEventPages = [...checkpointEventPlanning.querySelectorAll("[data-checkpoint-event-page]")];
        const knownCheckpointPages = new Set(checkpointEventTabs.map((button) => button.dataset.checkpointEventTab));
        const requestedCheckpointPage = new URLSearchParams(location.search).get("eventPage");
        const showCheckpointEventPage = (pageId, updateUrl = false) => {
          const activePageId = knownCheckpointPages.has(pageId) ? pageId : CHECKPOINT_EVENT_PAGES[0].id;
          checkpointEventTabs.forEach((button) => button.classList.toggle("is-active", button.dataset.checkpointEventTab === activePageId));
          checkpointEventPages.forEach((page) => {
            const active = page.dataset.checkpointEventPage === activePageId;
            page.classList.toggle("is-active", active);
            page.hidden = !active;
          });
          if (updateUrl && location.protocol !== "file:") {
            const nextUrl = new URL(location.href);
            nextUrl.searchParams.set("eventPage", activePageId);
            history.replaceState(null, "", nextUrl);
          }
        };
        checkpointEventTabs.forEach((button) => button.addEventListener("click", () => showCheckpointEventPage(button.dataset.checkpointEventTab, true)));
        showCheckpointEventPage(requestedCheckpointPage || CHECKPOINT_EVENT_PAGES[0].id);

          },

              "【异常兜底】题目、动画或角色资源缺失时跳过对应演出，仍必须展示最终胜负、席位变化和实际奖励。",

              "【保护区】前三档共601席为个人NPC晋级区；第602席“州级舞台第1000名”开始进入同服真人与NPC共享竞争区。",
              "【节点状态】已跨越梯度显示完成勾选；当前梯度高亮并显示梯度内名次；尚未到达的梯度显示锁定。",
              "【节点点击】点击当前或已完成节点只展开该级席位容量、曝光区间和奖励说明；锁定节点点击后提示到达条件，不跳转挑战。",

              "【返回】返回节目主场景，并保持进入前的主界面状态与未领取收益显示。",
            ],
          },
        };
        const renderTalentRules = (screen) => {
          const copy = talentScreenRules[screen] || talentScreenRules.main;
          document.querySelector("[data-talent-rule-step]").textContent = copy.step;
          document.querySelector("[data-talent-rule-title]").textContent = copy.title;
          document.querySelector("[data-talent-rule-summary]").textContent = copy.summary;
          document.querySelector("[data-talent-rule-list]").innerHTML = copy.rules.map((rule) => `<li>${escapeHtml(rule)}</li>`).join("");
        };
        window.addEventListener("message", (event) => {
          if (event.source === talentFrame.contentWindow && event.data?.type === "talent-showcase-screen") {
            renderTalentRules(event.data.screen);
          }
        });
        renderTalentRules("main");
      }
      const checkpointGallery = document.querySelector("[data-checkpoint-gallery]");
      if (checkpointGallery) {
        const checkpointSlides = [...checkpointGallery.children];
        const checkpointCount = document.querySelector("[data-checkpoint-gallery-count]");
        const checkpointDots = [...document.querySelectorAll(".checkpoint-gallery-dots i")];
        let checkpointGalleryIndex = 0;
        const showCheckpointSlide = (nextIndex) => {
          checkpointGalleryIndex = (nextIndex + checkpointSlides.length) % checkpointSlides.length;
          checkpointGallery.scrollTo({ left: checkpointGallery.clientWidth * checkpointGalleryIndex, behavior: "smooth" });
          checkpointCount.textContent = `${checkpointGalleryIndex + 1} / ${checkpointSlides.length}`;
          checkpointDots.forEach((dot, dotIndex) => dot.classList.toggle("is-active", dotIndex === checkpointGalleryIndex));
        };
        document.querySelector("[data-checkpoint-gallery-prev]").addEventListener("click", () => showCheckpointSlide(checkpointGalleryIndex - 1));
        document.querySelector("[data-checkpoint-gallery-next]").addEventListener("click", () => showCheckpointSlide(checkpointGalleryIndex + 1));
        checkpointGallery.addEventListener("scroll", () => {
          const visibleIndex = Math.round(checkpointGallery.scrollLeft / Math.max(1, checkpointGallery.clientWidth));
          if (visibleIndex !== checkpointGalleryIndex) {
            checkpointGalleryIndex = visibleIndex;
            checkpointCount.textContent = `${checkpointGalleryIndex + 1} / ${checkpointSlides.length}`;
            checkpointDots.forEach((dot, dotIndex) => dot.classList.toggle("is-active", dotIndex === checkpointGalleryIndex));
          }
        }, { passive: true });
      }
    }
  </script>
