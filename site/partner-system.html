        <p class="eyebrow">PARTNER SYSTEM · 规则、配置与界面</p>
        <h1>伙伴系统</h1>
        <p>伙伴系统包含伙伴获取、亲密度、经营技能、谈心、羁绊、集训、同游、服装和名气技能。系统规则、配置表和界面规则分开查阅。</p>
      </header>
      <div class="partner-note"><strong>配置边界：</strong>伙伴 ID、表字段、条件、消耗、奖励、权重、上限和关联关系按本页配置表执行；“伙伴、亲密度、经营、谈心、羁绊、人脉、名气”是本项目正式显示名。截图中的账号数量只用于说明界面状态，不作为默认值。</div>
      <div class="partner-panel" id="partner-rules-panel" role="tabpanel" aria-labelledby="partner-tab-rules">
        <nav class="partner-nav" aria-label="系统规则目录">
          <button type="button" data-section="partner-core">系统规则</button>
          <button type="button" data-section="partner-terms">包装名词</button>
        </nav>
        <section class="content-section" id="partner-core">
          <div class="section-head"><h2><span>01</span>系统规则</h2></div>
          <div class="partner-grid">
            <article class="partner-card"><h3>对象、获取与列表</h3>
              <p>每名伙伴一对一沿用原 <code>BeautyInfoCfg.Id</code>／BeautyId。拥有状态以 <code>BeautyDataModel.NewBeautyDataDic</code> 为准；未结识可从目标页查看原 <code>GetType、GetParam、JumpId</code> 对应的条件和来源。已结识与未结识分层，列表筛选读取原 <code>Profession</code>，排序保留默认／亲密度两种模式。</p>
              <p>原配置、屏蔽和投放决定可见总数；示例图的 29/34 是单账号状态，不是系统上限。卡片、详情、目标使用同一 BeautyId，不能生成第二份伙伴数据。</p>
            </article>
            <article class="partner-card"><h3>亲密度与赠礼</h3>
              <p>原 <code>Popular</code> 玩家可见名为“亲密度”。伙伴初始值读 <code>BeautyInfoCfg.Popularity</code>，实际当前值读服务端伙伴状态。赠礼道具及单件收益读 <code>GameConfigCfg.BEAUTY_POP_ITEM_CONFIG</code>，当前原表为 100027→1、100028→2、100029→5；物品名称、图标和库存从物品与背包数据读取。</p>
              <p>普通赠送一次；勾选十连按原逻辑上限和库存取可赠数量。资源不足展示来源；只在原赠礼请求成功后更新亲密度、库存、红点与关联显示，不以客户端动画预扣预加。</p>
            </article>
            <article class="partner-card"><h3>羁绊晋升</h3>
              <p>“羁绊”对应原美名／称号晋升，不是亲密度的别名。阶段名、所需亲密度、已结识伙伴数、品质倍率及效果均读 <code>BeautyReputationCfg</code>。晋升前同时校验下一阶段的 <code>Popularity</code> 与 <code>BeautyNum</code>；达到最高档不再晋升。</p>
              <p>点击晋升走原 <code>RequestNewBeautyTitleUpgrade</code>；成功结果展示前后阶段与实际效果，并回写详情和羁绊册。原表 12 档，实际可达性仍受原版投放约束，不按截图的具体人数自行放宽。</p>
            </article>
            <article class="partner-card"><h3>经营技能与商铺赚速</h3>
              <p>“经营技能”对应原带货技能。每个技能的目标商铺类型、效果范围、升级经验和权重取 <code>BeautyBringingSkillCfg</code>；全体伙伴的分类加成按原 <code>BeautyHelper.CalcTotalSkillAddValue(shopType)</code> 汇总，已解锁技能数按 <code>CalcTotalSkillCount</code> 统计。</p>
              <p>商铺仍使用生活、休闲、购物、娱乐分类。界面预览和实际店铺收益应读取原统一计算结果，不新增第二套加成，也不把原图四项百分比写成常量。</p>
            </article>
            <article class="partner-card"><h3>谈心与心意</h3>
              <p>“谈心”对应原祈星。至少拥有一名伙伴才可执行；心意当前值、上限及恢复时间分别读原状态和 <code>LevelCfg.DateBackEnergy / DateBackEnergyRecoverTime</code>。心意不足时沿原道具 <code>100030</code> 的使用／来源流程。</p>
              <p>一键谈心须先达到累计谈心次数门槛 <code>GameConfigCfg.BEAUTY_QUICK_DRAW_CONFIG</code>（当前原表 5 次）；勾选偏好沿原设置保存。请求成功后按返回的每名伙伴结果展示，跳过动画不改变抽取或奖发结果。</p>
            </article>
            <article class="partner-card"><h3>集训与亲密度票</h3>
              <p>集训席位按 <code>BEAUTY_DATE_BAN_CONFIG</code> 的结识数量开放，付费席按 <code>BEAUTY_DATE_BAN_COST</code> 顺序开启。空席选择已结识伙伴；已安排席位点击召回须二次确认，并自动领取当前舞台可领的亲密度票。可领时才提交原领取请求，无可领值不发放。</p>
              <p>集训中的伙伴暂不参与谈心、同游、招收学徒与使用增加亲密度道具时的随机选取。席位数、累计产出、可领状态均读原服务端集训数据；图片的 5/5、+0 不作固定配置。</p>
            </article>
            <article class="partner-card"><h3>人脉、名气技能与服装</h3>
              <p>“人脉”是原缘分页的本项目界面名：关联人才由 <code>BeautyInfoCfg.Partner</code> 及 <code>BeautyAdvanceCfg.Partner</code> 读取；技能等级、消耗与当前／下级效果沿原 <code>BeautyUpgradeCfg.Cost / Attr</code> 和技能配置。关联人才继续使用人才系统的同一对象。</p>
              <p>“名气技能”对应原仪容技能。技能列表、升级消耗、当前效果和满级状态沿用原 <code>SkillUpgradeCfg</code>；上限按 <code>BeautyHelper.GetFaceSkillMaxLv</code> 结合服装强化条件计算。服装来自 <code>AppearanceCfg</code>，预览、持有、穿戴和强化不混为一次操作。</p>
            </article>
            <article class="partner-card"><h3>同游</h3>
              <p>保留陶艺、花艺两种原同游项目。陶艺费用随本伙伴已同游次数按 <code>BEAUTY_CERAMICS_COST</code> 取档，花艺沿用原固定道具消耗；亲密度收益按 <code>BEAUTY_TRAVEL_POP_CONFIG</code> 读取。两种项目均与学徒座位状态联动：座位不足时先按原规则提醒，再由玩家决定是否继续。</p>
              <p>同游结算以原服务端响应为准；跨学徒系统的具体人选与奖励仍用原流程，不在本页另造学徒规则。</p>
            </article>
            <article class="partner-card wide"><h3>跨系统与结算边界</h3>
              <p>伙伴与人才、店铺、学徒、道具、排行和服装共用原对象链。伙伴带来的分类商铺加成直接进入原店铺计算；人脉页的相关人才链接到现有人才系统；同游获得的学徒沿原学徒系统入账。所有消耗、奖励、状态更新与失败回滚以原请求结果为准，不因为包装改名而改协议、资源 ID、触发时机或数值。</p>
            </article>
          </div>
        </section>
        <section class="content-section" id="partner-daily"></section>
        <section class="content-section" id="partner-terms">
          <div class="section-head"><h2><span>03</span>本项目术语</h2></div>
          <article class="partner-card"><table><thead><tr><th>正式名称</th><th>适用对象</th><th>规则含义</th></tr></thead><tbody>
            <tr><td>伙伴</td><td>伙伴角色对象</td><td>列表、详情、获取、谈心、服装和技能页统一使用的角色称谓。</td></tr>
            <tr><td>亲密度</td><td>伙伴关系数值</td><td>伙伴初始值、赠礼增量、阶段门槛和效果计算使用的关系数值。</td></tr>
            <tr><td>经营／经营技能</td><td>商铺增益</td><td>伙伴技能对生活、休闲、购物、娱乐四类商铺的累计赚速加成。</td></tr>
            <tr><td>谈心</td><td>随机互动</td><td>消耗心意并产生伙伴互动结果；一键谈心只改变本次执行次数。</td></tr>
            <tr><td>羁绊／羁绊册</td><td>阶段成长</td><td>按亲密度和已结识伙伴数提升的阶段系统，与亲密度数值本身分开。</td></tr>
            <tr><td>人脉／人脉技能</td><td>伙伴与人才关联</td><td>展示关联人才并提供对应技能等级、消耗和效果。</td></tr>
            <tr><td>名气／名气技能</td><td>服装关联技能</td><td>由服装品质和强化条件影响等级上限的技能页。</td></tr>
            <tr><td>集训、同游、服装、目标、心意</td><td>页面和资源名称</td><td>本项目保留的通用功能名；具体字段和条件以配置表与系统规则为准。</td></tr>
          </tbody></table></article>
        </section>
      </div>
      <div class="partner-panel" id="partner-config-panel" role="tabpanel" aria-labelledby="partner-tab-config" hidden>
        <section class="content-section" id="partner-config">
          <div class="section-head"><h2><span>01</span>配置表</h2></div>
          <section class="content-section" id="partner-daily-config"></section>
          <article class="partner-card wide">
            <p>本页列出伙伴系统实际使用的表结构、字段、类型、关联和用途。字段名作为正式配置字段保留；表内记录数为当前版本有效范围，后续新增伙伴、服装、技能或剧情时在对应表中追加，不另建同义表。</p>
          </article>

          <article class="partner-card wide"><h3>伙伴基础表 BeautyInfoCfg</h3><p class="partner-muted">当前 31 条；一名伙伴对应一个 Id，列表、详情、目标、谈心结果和关联人才均使用同一 Id。</p>
            <table><thead><tr><th>英文字段</th><th>中文名称</th><th>类型／结构</th><th>使用说明</th></tr></thead><tbody>
              <tr><td><code>Id</code></td><td>伙伴ID</td><td>int，唯一</td><td>伙伴主键，关联所有伙伴状态、服装、技能和剧情。</td></tr>
              <tr><td><code>name</code>／<code>desc</code>／<code>voiceDesc</code></td><td>名称／简介／语音简介</td><td>多语言 key</td><td>列表卡、详情页和获得展示读取；玩家可见词使用伙伴包装。</td></tr>
              <tr><td><code>quality</code></td><td>初始品质</td><td>int</td><td>未进阶时的品质；进阶后由 <code>BeautyAdvanceCfg.Quality</code> 接管。</td></tr>
              <tr><td><code>Popularity</code></td><td>初始亲密度</td><td>int</td><td>结识后的初始亲密度及基础效果计算。</td></tr>
              <tr><td><code>Reputation</code></td><td>初始羁绊阶段</td><td>int → <code>BeautyReputationCfg.Id</code></td><td>结识时的羁绊起点。</td></tr>
              <tr><td><code>Skill</code></td><td>经营技能组</td><td>int／技能 ID</td><td>伙伴结识后开放的经营技能入口及初始技能关系。</td></tr>
              <tr><td><code>modelId</code></td><td>基础立绘模型</td><td>int／资源 ID</td><td>详情、获得展示和谈心结果使用的默认模型。</td></tr>
              <tr><td><code>Profession</code></td><td>伙伴类型</td><td>int／类型枚举</td><td>列表类型筛选、职业图标及经营技能分类。</td></tr>
              <tr><td><code>GetType</code>／<code>GetParam</code>／<code>JumpId</code></td><td>获取方式／获取参数／跳转目标</td><td>int、int[]、int</td><td>目标页和未结识详情展示获取条件；招募、VIP、组合兑换等入口按此字段决定按钮和跳转。</td></tr>
              <tr><td><code>Partner</code></td><td>关联人才</td><td>int[]／人才 ID</td><td>人脉页、获得展示和伙伴详情展示关联人才。</td></tr>
              <tr><td><code>Advance</code></td><td>进阶配置 ID</td><td>int → <code>BeautyAdvanceCfg.Id</code></td><td>存在进阶配置时显示进阶入口并读取进阶后的品质、技能和关联人才。</td></tr>
              <tr><td><code>Course</code></td><td>集训课程</td><td>int／课程 ID</td><td>集训页确定伙伴可参与的课程类型。</td></tr>
              <tr><td><code>Offset</code></td><td>立绘偏移</td><td>int[]</td><td>详情、结果和弹窗中的模型定位参数。</td></tr>
              <tr><td><code>paradeDesc</code></td><td>展示说明</td><td>多语言 key</td><td>伙伴展示或获得结果中的补充文案。</td></tr>
              <tr><td><code>DatePlot</code>／<code>PlotId</code></td><td>谈心／同游剧情入口</td><td>int</td><td>关联谈心、同游及剧情内容；无配置时不显示对应入口。</td></tr>
            </tbody></table>
          </article>

          <article class="partner-card wide"><h3>伙伴进阶表 BeautyAdvanceCfg</h3><p class="partner-muted">当前 6 条；仅配置可进阶伙伴填写，结识后按服装条件和进阶条件判定。</p>
            <table><thead><tr><th>英文字段</th><th>中文名称</th><th>类型／结构</th><th>使用说明</th></tr></thead><tbody>
              <tr><td><code>Id</code></td><td>进阶配置 ID</td><td>int，唯一</td><td>由 <code>BeautyInfoCfg.Advance</code> 关联。</td></tr>
              <tr><td><code>BeautyId</code></td><td>伙伴 ID</td><td>int → <code>BeautyInfoCfg.Id</code></td><td>确定进阶对象。</td></tr>
              <tr><td><code>Type</code></td><td>进阶类型</td><td>int／枚举</td><td>确定进阶入口和条件分支。</td></tr>
              <tr><td><code>Skill</code></td><td>进阶专属技能</td><td>int／技能 ID</td><td>进阶成功后新增或替换的伙伴专属技能。</td></tr>
              <tr><td><code>Quality</code>／<code>Popularity</code>／<code>Reputation</code></td><td>进阶品质／亲密度／羁绊</td><td>int</td><td>进阶成功后更新对应品质、属性和阶段。</td></tr>
              <tr><td><code>Partner</code></td><td>进阶后关联人才</td><td>int[]／人才 ID</td><td>进阶后人脉页新增的关联人才。</td></tr>
            </tbody></table>
          </article>

          <article class="partner-card"><h3>羁绊阶段表 BeautyReputationCfg</h3><p class="partner-muted">当前 12 条；阶段顺序由 Id 决定。</p>
            <table><thead><tr><th>字段</th><th>中文名称</th><th>类型／用途</th></tr></thead><tbody>
              <tr><td><code>Id</code>／<code>name</code></td><td>阶段 ID／阶段名称</td><td>int、多语言 key；羁绊册和晋升结果显示。</td></tr>
              <tr><td><code>Popularity</code>／<code>BeautyNum</code></td><td>亲密度门槛／已结识伙伴数门槛</td><td>int；下一阶段需同时满足两项。</td></tr>
              <tr><td><code>studentQualityName</code>／<code>Rate</code></td><td>学徒品质名／效果倍率</td><td>多语言 key、int；阶段晋升后影响学徒品质和对应倍率。</td></tr>
            </tbody></table>
          </article>

          <article class="partner-card"><h3>经营技能表 BeautyBringingSkillCfg</h3><p class="partner-muted">当前 140 条；经营技能和四类商铺加成使用同一套技能记录。</p>
            <table><thead><tr><th>字段</th><th>中文名称</th><th>类型／用途</th></tr></thead><tbody>
              <tr><td><code>Id</code></td><td>经营技能 ID</td><td>int，关联伙伴的技能组。</td></tr>
              <tr><td><code>Exp</code></td><td>升级经验</td><td>int；技能提升所需经验。</td></tr>
              <tr><td><code>EarnSpeedRateTarget</code></td><td>目标赚速倍率</td><td>int；技能完成后对目标商铺赚速的效果。</td></tr>
              <tr><td><code>EffectRange</code></td><td>效果等级范围</td><td>int[]；技能等级可生效区间。</td></tr>
              <tr><td><code>FreeWeightRange</code>／<code>PayWeightRange</code></td><td>免费／付费权重范围</td><td>int[][]；经营技能升级与效果计算使用的权重曲线。</td></tr>
            </tbody></table>
          </article>

          <article class="partner-card"><h3>人脉技能升级表 BeautyUpgradeCfg</h3><p class="partner-muted">当前 1000 条；每条 Id 对应一个人脉技能等级。</p>
            <table><thead><tr><th>字段</th><th>中文名称</th><th>类型／用途</th></tr></thead><tbody>
              <tr><td><code>Id</code></td><td>技能等级</td><td>int；当前等级及下一级索引。</td></tr>

        <section class="content-section" id="partner-interface">
          <article class="detail-card shop-ui-rules-card editor-rules-card" data-shop-ui-rules><div role="status">正在读取界面规则…</div></article>
        </section>
        <section class="content-section" id="partner-visit-flow-ui"></section>
        <p class="partner-warning">界面规则依据已确认截图和本页配置表编写；截图内原词仅作区域与状态参考，正文使用本项目包装名。</p>
      </div>
    </article>
  </template>
  <script type="module">
    import { mount, pageShell } from "./assets/site.js?v=20261019-partner";
    import { renderShopUiRulesCard } from "./assets/editor-view.js?v=20261008-1";
    const topActions = '<button class="button shop-top-back" type="button" aria-label="返回上一页" onclick="if (history.length > 1) { history.back(); } else { location.href=\'index.html\'; }">← 返回</button><nav class="shop-page-tabs" aria-label="伙伴系统策划案分页"><button type="button" id="partner-tab-rules" class="is-active" aria-pressed="true" data-partner-tab="rules">系统规则</button><button type="button" id="partner-tab-config" aria-pressed="false" data-partner-tab="config">配置表</button><button type="button" id="partner-tab-ui" aria-pressed="false" data-partner-tab="ui">界面规则</button></nav>';
    mount(pageShell({ activeGroup: "partner-system", content: document.querySelector("#partner-content").innerHTML, topActions }));
    function switchTab(name, updateUrl = true) {
      const active = ["rules", "config", "ui"].includes(name) ? name : "rules";
      document.querySelectorAll("[data-partner-tab]").forEach((button) => {
        const selected = button.dataset.partnerTab === active;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
      document.querySelector("#partner-rules-panel").hidden = active !== "rules";
      document.querySelector("#partner-config-panel").hidden = active !== "config";
      document.querySelector("#partner-ui-panel").hidden = active !== "ui";
      if (updateUrl) {
        const next = new URL(location.href);
        if (active !== "rules") next.searchParams.set("tab", active);
        else next.searchParams.delete("tab");
        next.hash = active === "ui" ? "partner-interface" : active === "config" ? "partner-config" : "partner-core";
        history.replaceState(null, "", next);
      }
      document.querySelector(".partner-page").scrollIntoView({ block: "start" });
    }
    document.querySelectorAll("[data-partner-tab]").forEach((button) => button.addEventListener("click", () => switchTab(button.dataset.partnerTab)));
    document.querySelectorAll("[data-section]").forEach((button) => button.addEventListener("click", () => document.getElementById(button.dataset.section).scrollIntoView({ block: "start" })));
    const initialTab = new URLSearchParams(location.search).get("tab");
    if (location.hash === "#partner-interface" || initialTab === "ui") switchTab("ui", false);
    else if (location.hash === "#partner-config" || initialTab === "config") switchTab("config", false);
    // 整案正文覆盖会把会客室规则与日常互动配置一起写入 #partner-daily；只把配置表文章移到配置分页，保留其余规则原位。
    const normalizePartnerConfigTables = () => {
      const panel = document.querySelector("#partner-config-panel");
      if (!panel) return;
      const headers = ["英文字段", "中文名称", "类型／结构", "使用说明"];
      panel.querySelectorAll("table").forEach((table) => {
        if (table.dataset.partnerNormalized === "true") return;
        const headCells = [...table.querySelectorAll("thead th")];
        const rows = [...table.querySelectorAll("tbody tr")];
        const articleTitle = table.closest("article")?.querySelector("h3")?.textContent.trim() || "";
        if (headCells.length === 3 && table.closest("#partner-daily-config")) {
          headCells[0].textContent = headers[0];
          headCells[1].textContent = headers[2];
          headCells[2].textContent = headers[3];
          const nameHeader = document.createElement("th"); nameHeader.textContent = headers[1];
          headCells[0].after(nameHeader);
          const names = {
            "BeautySufuCfg": "会客室伙伴基础",
            "BeautySufuInteractionCfg / BeautySufuPlotCfg": "互动节点与剧情",
            "SUFU_MOOD_WEIGHT": "心情随机权重",
            "SUFU_LISTEN_UNLOCK_EVENT_COUNT / SUFU_STORY_UNLOCK_EVENT_COUNT": "倾听／往事解锁门槛",
            "SUFU_INTERACTION_TIMES / SUFU_INTERACTION_REWARD": "互动回礼门槛与奖励",
            "SUFU_INTERACTION_REWARD2": "互动即时奖励",
            "SUFU_ROOM_PARTNER / ROOM_UNLOCK_IDENTITY / ROOM_MOVE_IDENTITY": "会客室槽位与开放",
            "旅馆家具配置（新增关联项）": "伙伴专属家具",
            "会客室每日来访（本项目新增配置）": "每日来访规则",
            "伙伴来访簿（本项目新增入口）": "伙伴来访簿",
          };
          rows.forEach((row) => {
            const cells = [...row.children];
            const name = names[cells[0]?.textContent.trim()] || "配置项";
            const nameCell = document.createElement("td"); nameCell.textContent = name;
            row.insertBefore(nameCell, cells[1]);
          });
        } else if (headCells.length === 3 && (articleTitle === "服装与技能配置" || articleTitle === "全局参数与资源表")) {
          headCells.forEach((cell, index) => { cell.textContent = headers[index === 0 ? 0 : index === 1 ? 2 : 3]; });
          const nameHeader = document.createElement("th"); nameHeader.textContent = headers[1];
          headCells[0].after(nameHeader);
          rows.forEach((row) => {
            const cells = [...row.children];
            const nameCell = document.createElement("td");
            nameCell.textContent = articleTitle === "服装与技能配置" ? "关键字段" : "字段与当前值";
            row.insertBefore(nameCell, cells[1]);
          });
        } else if (headCells.length === 3) {
          headCells.forEach((cell, index) => { cell.textContent = headers[index]; });
          const usageHeader = document.createElement("th"); usageHeader.textContent = headers[3];
          headCells[2].after(usageHeader);
          rows.forEach((row) => {
            const cells = [...row.children];
            if (cells.length !== 3) return;
            const source = cells[2].textContent.trim();
            const split = source.match(/^(.+?[；。])([\s\S]*)$/);
            const typeCell = document.createElement("td");
            const usageCell = document.createElement("td");
            typeCell.textContent = split ? split[1].replace(/[；。]$/, "") : source;
            usageCell.textContent = split?.[2]?.trim() || "—";
            row.replaceChild(typeCell, cells[2]);
            row.appendChild(usageCell);
          });
        } else if (headCells.length === 4) {
          headCells.forEach((cell, index) => { cell.textContent = headers[index]; });
        }
        table.dataset.partnerNormalized = "true";
      });
    };
    const relocatePartnerDailyConfig = () => {
      const source = document.querySelector("#partner-daily");
      const target = document.querySelector("#partner-daily-config");
      if (!source || !target) return;
      const configArticle = [...source.children].find((element) => element.tagName === "ARTICLE" && element.querySelector("h3")?.textContent.trim() === "日常互动配置");
      if (configArticle && !target.contains(configArticle)) target.replaceChildren(configArticle);
      normalizePartnerConfigTables();
    };
    relocatePartnerDailyConfig();
    const partnerDailyObserver = new MutationObserver(relocatePartnerDailyConfig);
    partnerDailyObserver.observe(document.querySelector("#partner-daily") || document.body, { childList: true, subtree: true });
    if (!window.frameElement) {
      const card = document.querySelector("[data-shop-ui-rules]");
      try {
        const response = await fetch("api/shop-ui/formal", { cache: "no-store" });
        if (!response.ok) throw Error("读取失败");
        const documentData = (await response.json()).documents?.["partner-system"];
        if (!documentData?.uiRules?.length) throw Error("尚未发布");
        const state = { screenId: "main", selectedId: 1, expandedPopupKey: "", expandedNestedPopupKey: "" };
        const draw = () => renderShopUiRulesCard(card, documentData, {
          screenId: state.screenId, selectedId: state.selectedId,
          expandedPopupKey: state.expandedPopupKey, expandedNestedPopupKey: state.expandedNestedPopupKey,
          onSelectScreen(id) { state.screenId = id; state.selectedId = 1; state.expandedPopupKey = ""; state.expandedNestedPopupKey = ""; draw(); },
          onSelect(id) { state.selectedId = id; state.expandedPopupKey = ""; state.expandedNestedPopupKey = ""; draw(); },
          onTogglePopup(key) { state.expandedPopupKey = state.expandedPopupKey === key ? "" : key; state.expandedNestedPopupKey = ""; draw(); },
          onToggleNestedPopup(key) { state.expandedNestedPopupKey = state.expandedNestedPopupKey === key ? "" : key; draw(); },
        });
        draw();
      } catch {
        card.innerHTML = "<h2>界面规则暂不可用</h2><p>伙伴系统的正式界面规则尚未发布；请在整案编辑器查看当前草稿。</p>";
      }
    }
  </script>
