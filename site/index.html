            <div class="sequence-row"><span class="sequence-label">收购旧店</span><span>待售旧店保留原行业招牌、停业告示和闲置设备。玩家完成收购后投入整修、恢复营业，原店主或员工可受邀留下；店铺收益与经营决策归玩家。</span></div>
            <div class="sequence-row"><span class="sequence-label">盘铺新开</span><span>取得空铺或闲置物业后，由玩家建设新店。美术从空房、空院、无行业标识的状态，逐步变成自有招牌、设备、工作区和营业场景。开局旅馆及附属洗车位属于继承资产。</span></div>
            <div class="sequence-row"><span class="sequence-label">经营循环</span><span>获得店铺 → 整修开业 → 招募或委任员工 → 升级设备与服务 → 持续赚取经营收益 → 投入旅馆与下一家店铺。游客停留与小镇名气承接长期目标，暂不额外定义新货币或数值系统。</span></div>
            <div class="sequence-row"><span class="sequence-label">玩法分工</span><span>主线店铺以服务、加工和体验承接持续经营收益；镇上自产纪念品并入 03 超市／便利店，作为后续解锁商品品类，不再单独开设纪念品店。进货转售的额外收益玩法统一在该店规划，烧烤包装保留给宴会系统，不占本轮经营店铺名额。</span></div>
            <div class="sequence-row"><span class="sequence-label">当前范围</span><span>本轮更新总览经营框架与前 12 家顺序。13—20 家重新筛选；店铺详情、功能系统开放节点、具体等级与剧情主线后续另行衔接。</span></div>
          </div>
        </section>

        <section class="content-section" id="storyline">
          <div class="section-head"><h2><span>04</span>剧情主线</h2><p>这里只确定长线悬念与主要转折；具体章节进入独立剧情分页细写。</p></div>
          <div class="sequence-strip">
            <div class="sequence-row"><span class="sequence-label">前期故事基调</span><span>只安排一次因陌生而产生的不信任，随后转向兄妹帮助镇民、赢得接纳、发展感情关系，再由邻镇报复牵出家族旧势力。</span></div>
            <div class="sequence-row"><span class="sequence-label">主角能力边界</span><span>城市经验只表现为查账、定价、排期、营销、谈判和资源组织能力，聪明但不奸诈，不使用黑心商业手段。</span></div>
            <div class="sequence-row"><span class="sequence-label">人物投放节奏</span><span>首位人才对标身份 2；首位伙伴对标身份 4；后续重要伙伴分别参考《赘婿》剧情节点 5、12、16、22 的引入节奏。普通人才随身份阶段持续加入。</span></div>
          </div>
          <div class="story-premise"><strong>Part 1主线：</strong>兄妹从被怀疑到被小镇接纳，成功救活周末集市后遭到邻镇商人报复。对方将兄妹重新起势的消息传给夺产亲戚，引来家族旧势力再次打压。Part 1解决夺产亲戚这一层，结尾只揭示其背后还有区域商业集团，为后续留下悬念。</div>
          <div class="roadmap story-roadmap">
            <article class="stage" style="--accent:var(--rust)"><h3>最后一把旅馆钥匙</h3><p>双胞胎带着破产羞辱来到小镇，面对银行回收和一团糟的旅馆。留下看门的老员工起初准备离职，却在两人亲手修屋、洗车还债后决定再帮一次。</p><span class="unlock"><b>人物解锁：</b>首位人才——旅馆老员工</span></article>
            <article class="stage" style="--accent:var(--blue)"><h3>修好那辆旧巴士</h3><p>兄妹在旅馆停车场发现一辆长期报废的接驳巴士。面对昂贵的修理报价，他们请来本地修车师傅一起检查故障、寻找零件并完成试车，让巴士重新成为旅馆连接小镇的交通与宣传入口。</p><span class="unlock"><b>剧情小游戏：</b>检查故障 · 更换零件 · 启动试车<br><b>人物解锁：</b>第二位人才——本地修车师傅<br><b>功能解锁：</b>旅馆接驳巴士</span></article>
            <article class="stage" style="--accent:var(--green)"><h3>加油站少了一箱货</h3><p>兄妹向附近加油站借来工具和应急物资，归还时却被发现少了一箱货。两人根据送货单和仓库记录查出货物被错装上外地卡车，不仅洗清嫌疑，也帮助经营者追回损失。</p><span class="unlock"><b>人物解锁：</b>第三位人才——加油站经营者<br><b>商铺衔接：</b>加油站 + 便利店</span></article>
            <article class="stage" style="--accent:var(--gold)"><h3>差点办不成的周末集市</h3><p>小镇集市因供货、摊位、交通和宣传同时出问题而面临取消。兄妹重新安排摊位、组织巴士接送、协调食品供应并完成宣传，让原本冷清的集市成为小镇近期最热闹的一天。</p><span class="unlock"><b>人物解锁：</b>首位伙伴——地方报社记者 / 活动协办人<br><b>关系推进：</b>在共同救场、争执与互相补位中产生好感</span></article>
            <article class="stage" style="--accent:var(--rust)"><h3>被砸掉的旅馆招牌</h3><p>集市成功带来客流，也抢走了邻镇部分生意。几名邻镇商人暗中破坏旅馆招牌、巴士和集市摊位，兄妹与伙伴通过照片、货运记录和证人找到真凶，迫使对方当众赔偿。</p><span class="unlock"><b>关系推进：</b>首位伙伴参与调查，感情进一步升温<br><b>阶段对手：</b>邻镇商人</span></article>
            <article class="stage" style="--accent:var(--blue)"><h3>家族的人找上门了</h3><p>邻镇商人将刊登兄妹事迹的报纸剪报传真给夺产亲戚。家族代理人随即来到小镇，以旧债、产权和家族名义施压，并在众人面前羞辱兄妹，要求他们再次交出旅馆。</p><span class="unlock"><b>主线升级：</b>小镇日常转入家族旧势力冲突<br><b>人物引入：</b>熟悉旧家族账目的会计 / 律师</span></article>
            <article class="stage" style="--accent:var(--rust)"><h3>他们想连小镇一起买走</h3><p>夺产亲戚开始断供、压价并收购周边商铺，企图迫使镇民与兄妹切割。此前受过帮助的商户拿出订单、账目和证言共同站队，兄妹也第一次从守住自家资产转为守住小镇的经营秩序。</p><span class="unlock"><b>人物阶段：</b>核心人才集结 · 小镇阵营形成<br><b>矛盾升级：</b>个人夺产转为区域商业对抗</span></article>
            <article class="stage" style="--accent:var(--green)"><h3>这一次，我们不走</h3><p>兄妹在小镇听证与资产处置中公开完整证据，击败负责夺产的亲戚，保住旅馆与商户。胜利后，他们从追回的清算文件中发现同一家区域商业集团反复出现，证明家族破产背后还有更深的操盘者。</p><span class="unlock"><b>Part 1结局：</b>夺产亲戚败退 · 兄妹正式被小镇接纳<br><b>后续悬念：</b>幕后区域商业集团浮出水面</span></article>
          </div>
        </section>

        <section class="content-section" id="scenes">
          <div class="section-head"><h2><span>05</span>美术相关</h2><p>这里只确定总览方向，详细规范进入后续独立美术需求。</p></div>
          <div class="art-brief">
            <p><strong>整体风格：</strong>90年代美式复古。</p>
            <p><strong>场景设计避雷点：</strong>避免用中式乡村逻辑理解美国小镇。1993年的基础商业与汽车文化已经完整，胜出方向强调阳光、汽车、餐饮、音乐、霓虹与公路旅行感；小镇可以建筑较旧、节奏较慢，但不能显得贫穷、荒废或闭塞。</p>
          </div>
          <div class="art-subhead"><h3>场景结构</h3></div>
          <div class="scene-grid scene-grid-three">
            <article class="scene" style="--accent:var(--rust);--scene-soft:var(--soft-rust)"><span class="where">镇内 · 俯视经营主场景</span><h3>小镇主街</h3><p>汽车旅馆位于镇内画面的入口或边缘，以建筑、停车场和车辆动线构成一块醒目的完整区域；其他商铺与系统建筑向小镇内部展开。采用俯视角，重点展示经营布局、建筑关系和日常客流。</p></article>
            <article class="scene" style="--accent:var(--green);--scene-soft:var(--soft-green)"><span class="where">镇内 · 俯视外围区域</span><h3>公路商业与生活区</h3><p>仍属于镇内场景，从主街自然过渡到加油便利店、花店温室、公路酒馆、汽车影院和仓储区域。少量农牧与自然景观只放在远端作为产业来源和空间过渡，不承担主视觉。</p></article>
            <article class="scene" style="--accent:var(--blue);--scene-soft:var(--soft-blue)"><span class="where">城市 · 第三人称观景视角</span><h3>90年代繁华都市</h3><p>以更有纵深的第三人称视角展示高楼、商业街、酒店、广告牌、车流和城市灯光，突出与镇内不同的繁华感。战斗竞争、出游及区域商业等相关功能主要放置在城市中。</p></article>
          </div>
        </section>

        <section class="content-section" id="module-entry">
          <div class="section-head"><h2><span>06</span>策划案模块入口</h2><p>总览阅读完成后，可按分类进入单个系统或商铺分页。</p></div>
          <div class="entry-grid">${renderEntryCards()}</div>
          <div class="notice" style="margin-top:18px">后续每个系统都拥有独立详情页。图片、业务升级、小游戏流程和修改记录只进入对应模块，不再把所有信息堆回总览。</div>
        </section>

        <footer>总览只讲清题材、开局、经营发展、剧情主线、模块和整体美术想象。详细规则均进入对应分页。</footer>
      </article>`;
